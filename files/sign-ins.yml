# Models for each sign-in omp supports here. install.py --sign-in NAME, repeated, in the order
# you want them tried:
#   - helpers: the first sign-in's small models run omp's background helpers (session titles,
#     commit messages, memory, judging, image reads). With no sign-in given, the helpers run on
#     whatever model the session uses, which always works but costs more.
#   - main: when a model hits a rate or usage limit, omp moves the turn to the next sign-in's
#     model of the same kind: a helper to the next sign-in's helper, your main model to the
#     next sign-in's main model. It goes back once the limit resets.
# Only name sign-ins you are signed in to inside omp: a fallback to one you are not is skipped.
claude:
  main: anthropic/claude-opus-5-5
  helpers:
    smol: anthropic/claude-sonnet-5-5:medium
    vision: anthropic/claude-sonnet-5-5
    commit: anthropic/claude-haiku-5-5
    tiny: anthropic/claude-haiku-5-5
    memory: anthropic/claude-haiku-5-5
    judge: anthropic/claude-haiku-5-5
codex:
  main: openai-codex/gpt-6-luna
  helpers:
    smol: openai-codex/gpt-6-luna
    vision: openai-codex/gpt-6-luna
    commit: openai-codex/gpt-6-luna
    tiny: openai-codex/gpt-6-luna
    memory: openai-codex/gpt-6-luna
    judge: openai-codex/gpt-6-luna
cursor:
  main: cursor/claude-opus-5-5
  helpers:
    smol: cursor/claude-sonnet-5-5
    vision: cursor/claude-sonnet-5-5
    commit: cursor/claude-haiku-5-5
    tiny: cursor/claude-haiku-5-5
    memory: cursor/claude-haiku-5-5
    judge: cursor/claude-haiku-5-5
grok:
  main: xai-oauth/grok-4.7
  helpers:
    smol: xai-oauth/grok-4.7
    vision: xai-oauth/grok-4.7
    commit: xai-oauth/grok-4.3
    tiny: xai-oauth/grok-4.3
    memory: xai-oauth/grok-4.3
    judge: xai-oauth/grok-4.3
mistral:
  main: mistral/zai-glm-5-3
  helpers:
    smol: mistral/zai-glm-5-3-flash
    vision: mistral/zai-glm-5-3-flash
    commit: mistral/zai-glm-5-3-flash
    tiny: mistral/zai-glm-5-3-flash
    memory: mistral/zai-glm-5-3-flash
    judge: mistral/zai-glm-5-3-flash
