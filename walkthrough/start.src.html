<!doctype html>
<!--
  Source of ../start.html, which is this page with the pages kit (Oat, house style, Archivo,
  Preact + htm) inlined, so it opens from disk with no server and no network.
  To rebuild after an edit: pages publish walkthrough/start.src.html --slug omp-starter-walkthrough,
  then copy the newest ~/.local/share/pages/omp-starter-walkthrough/v*.html to start.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up omp for Glitch</title>
<link rel="stylesheet" href="kit:oat.css">
<link rel="stylesheet" href="kit:house.css">
<style>
:root {
  --brand: light-dark(#5a3fc4, #b9a8ff);
  --paper: light-dark(#f4f4f7, #14131a);
  --surface: light-dark(#ffffff, #1d1b26);
  --rule: light-dark(#d9d7e3, #343142);
  --quiet: light-dark(#5f5c6e, #a29fb3);
  --slip: light-dark(#fffdf6, #221f2c);
  --slip-ink: light-dark(#2a2635, #ece9f5);
  --filled: light-dark(#0f6d62, #6fd6c4);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
body { background: var(--paper); }

.shell { max-width: 78rem; margin: 0 auto; padding: 2rem 1.5rem 4rem;
  display: grid; grid-template-columns: 13rem minmax(0, 1fr) 27rem; gap: 2.5rem; align-items: start; }

/* Title runs across the top. */
.masthead { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: end;
  padding-bottom: 1.25rem; border-bottom: 1px solid var(--rule); }
.masthead svg { width: 3.2rem; height: 3.2rem; color: var(--brand); }
.masthead h1 { margin: 0; font-stretch: 72%; font-weight: 780; font-size: 2.5rem; line-height: 1; letter-spacing: -.01em; }
.masthead p { margin: .35rem 0 0; color: var(--quiet); max-width: 46rem; }

/* Step rail: a real sequence, so numbered. */
.rail { list-style: none; margin: 0; padding: 0; position: sticky; top: 1.5rem; display: grid; gap: .15rem; }
.rail button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid;
  grid-template-columns: 1.7rem 1fr; gap: .55rem; align-items: center; padding: .45rem .5rem; border-radius: 8px; color: var(--quiet); }
.rail button:hover { background: var(--accent); }
.rail button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.rail .n { display: grid; place-items: center; width: 1.7rem; height: 1.7rem; border-radius: 50%;
  border: 1.5px solid var(--rule); font-size: .8rem; font-weight: 650; }
.rail li.done .n { border-color: var(--filled); color: var(--filled); }
.rail li.here button { color: var(--ink); font-weight: 620; }
.rail li.here .n { background: var(--brand); border-color: var(--brand); color: var(--paper); }

/* The question in front of you. */
.step { min-width: 0; }
.step h2 { margin: 0 0 .6rem; font-stretch: 78%; font-weight: 740; font-size: 1.75rem; line-height: 1.1; }
.step h2:focus { outline: none; }
.step > p, .step .lede { color: var(--ink); max-width: 38rem; }
.step .why { color: var(--quiet); font-size: .95rem; max-width: 38rem; }
.choices { display: grid; gap: .55rem; margin: 1.2rem 0; max-width: 38rem; }
.choice { display: grid; grid-template-columns: 1.2rem 1fr; gap: .7rem; align-items: start; padding: .8rem .95rem;
  border: 1.5px solid var(--rule); border-radius: 10px; background: var(--surface); cursor: pointer; }
.choice:has(input:checked) { border-color: var(--brand); }
.choice input { margin: .2rem 0 0; accent-color: var(--brand); }
.choice b { display: block; font-weight: 640; }
.choice span { color: var(--quiet); font-size: .92rem; }
.choice .rec { color: var(--brand); font-weight: 600; font-size: .85rem; margin-left: .35rem; }
.order { list-style: none; padding: 0; margin: 1.2rem 0 .6rem; display: grid; gap: .55rem; max-width: 38rem; }
.order .choice { grid-template-columns: 1.2rem 1fr auto; align-items: center; }
.order .choice input { margin: 0; }
.order .pos { color: var(--brand); font-weight: 700; margin-right: .4rem; }
.order .moves { display: flex; gap: .3rem; }
.order .moves button { min-width: 2.2rem; padding: .25rem .5rem; }
.field { display: grid; gap: .35rem; margin: 1.2rem 0; max-width: 38rem; }
.field input[type=text] { font-family: var(--mono); font-size: .95rem; }
.field small { color: var(--quiet); }
.check { display: flex; gap: .55rem; align-items: center; margin: .4rem 0; }
.check input { accent-color: var(--brand); }
.need { margin: 1rem 0; padding: 0; list-style: none; display: grid; gap: .7rem; max-width: 38rem; }
.need li { display: grid; grid-template-columns: 7.5rem 1fr; gap: .8rem; padding-bottom: .7rem; border-bottom: 1px solid var(--rule); }
.need b { font-weight: 650; }
.need span { color: var(--quiet); font-size: .95rem; }
.fixes { margin: 1.1rem 0; padding: 0; list-style: none; display: grid; gap: .55rem; max-width: 38rem; }
.fixes li { padding-left: 1rem; border-left: 3px solid var(--brand); }
.fixes span { color: var(--quiet); font-size: .93rem; display: block; }
.nav { display: flex; gap: .6rem; margin-top: 1.6rem; }
code, pre, kbd { font-family: var(--mono); }
.cmd { background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: .6rem .8rem; font-size: .9rem;
  white-space: pre-wrap; word-break: break-all; margin: .4rem 0 0; }
.finish ol { padding-left: 1.2rem; display: grid; gap: 1rem; max-width: 40rem; }
.finish li p { margin: 0 0 .2rem; }

/* The bold element: the prompt, filling in as you answer. */
.slip { position: sticky; top: 1.5rem; background: var(--slip); color: var(--slip-ink); border: 1px solid var(--rule);
  border-top: 5px solid var(--brand); border-radius: 4px 4px 12px 12px; padding: 1.1rem 1.2rem 1rem;
  box-shadow: 0 1px 0 var(--rule), 0 14px 30px -18px color-mix(in srgb, var(--brand) 55%, transparent); }
.slip header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: .7rem; }
.slip h3 { margin: 0; font-stretch: 78%; font-weight: 720; font-size: 1.1rem; }
.slip header span { color: var(--quiet); font-size: .82rem; }
.slip pre { margin: 0; font-size: .82rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; background: none; padding: 0; border: 0; }
.slip .blank { color: var(--quiet); }
.slip .fresh { color: var(--filled); font-weight: 600; }
.slip footer { display: flex; gap: .6rem; align-items: center; margin-top: 1rem; padding-top: .8rem; border-top: 1px dashed var(--rule); }
.slip footer small { color: var(--quiet); }
.copied { color: var(--filled); font-weight: 600; font-size: .9rem; }

@media (max-width: 1100px) {
  .shell { grid-template-columns: 11rem minmax(0, 1fr); }
  .slip { position: static; grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .slip .fresh { animation: settle .9s ease-out; }
  @keyframes settle { from { background: color-mix(in srgb, var(--filled) 22%, transparent); } to { background: transparent; } }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="kit:preact.js"></script>
<script>
const { html, render, useState, useRef } = htmPreact;
const { useEffect } = htmPreact;

const REPO = "https://github.com/starkedev/omp-starter-pack";

const SIGNINS = {
  claude: { label: "Claude", note: "Claude Pro or Max.", idle: "claude" },
  codex: { label: "ChatGPT (Codex)", note: "A ChatGPT plan.", idle: "never" },
  cursor: { label: "Cursor", note: "A Cursor plan.", idle: "other" },
  grok: { label: "Grok", note: "An xAI (Grok) account.", idle: "other" },
  mistral: { label: "Mistral", note: "A Mistral plan.", idle: "other" },
};
const IDLE = {
  "200000": { label: "Over 200K tokens", note: "Recommended.", set: "--set compaction.idleEnabled=true --set compaction.idleThresholdTokens=200000", words: "shrink it when it is over 200K tokens" },
  "150000": { label: "Over 150K tokens", note: "Tighter, for a smaller Claude plan.", set: "--set compaction.idleEnabled=true --set compaction.idleThresholdTokens=150000", words: "shrink it when it is over 150K tokens" },
  "300000": { label: "Over 300K tokens", note: "Looser, when long sessions matter more than usage.", set: "--set compaction.idleEnabled=true --set compaction.idleThresholdTokens=300000", words: "shrink it when it is over 300K tokens" },
  off: { label: "Never", note: "Leave idle conversations as they are.", set: "--set compaction.idleEnabled=false", words: "never shrink it" },
};
const WORKING = {
  "325000": { label: "At 325K tokens", note: "Recommended.", set: "--set compaction.thresholdTokens=325000", words: "shrink it at 325K tokens" },
  "200000": { label: "At 200K tokens", note: "Tighter, for a smaller Claude plan.", set: "--set compaction.thresholdTokens=200000", words: "shrink it at 200K tokens" },
  none: { label: "Only near the model's limit", note: "omp's default: up to a million tokens on the large models.", set: "--set compaction.thresholdTokens=-1", words: "no working limit (omp's default)" },
};

const STEPS = ["Before you start", "Your sign-ins", "Your Glitch folder", "Your GitHub", "Idle conversations", "While you work", "Hand it to Claude"];

function shq(s) {
  if (/^[\w@%+=:,./~-]+$/.test(s)) return s;
  if (s.startsWith("~/")) return "~/" + shq(s.slice(2));
  return "'" + s.replace(/'/g, "'\\''") + "'";
}
function names(text) { return text.split(/[\s,]+/).map(s => s.replace(/^@/, "")).filter(Boolean); }

function buildPrompt(a) {
  const lines = [];
  lines.push("Set me up with the omp starter pack. Follow AGENTS.md in this folder.");
  lines.push("");
  lines.push("I went through the walkthrough (start.html). My answers:");
  let sign = null;
  if (a.signins.length) sign = a.signins.map(k => SIGNINS[k].label).join(", then ")
    + (a.signins.length > 1 ? ", in that order" : "")
    + ` (${a.signins.map(k => "--sign-in " + k).join(" ")})` + (a.other ? "; I also use another provider" : "");
  else if (a.other) sign = "another provider, none of the listed ones (no --sign-in)";
  lines.push(["- Sign-ins I use in omp: ", sign, "signin"]);
  const glitch = a.noGlitch ? "I don't have one yet; skip the Glitch parts" : (a.glitch.trim() || null);
  lines.push(["- My Glitch folder: ", glitch, "glitch"]);
  let gh = null;
  if (a.ghMode === "none") gh = "none, I don't use GitHub";
  else if (a.ghMode === "find") gh = "please find them as AGENTS.md says, and read them back to me";
  else if (names(a.gh).length) gh = names(a.gh).join(", ") + " (read them back to me before using them)";
  lines.push(["- My GitHub accounts and organisations: ", gh, "gh"]);
  lines.push(["- Idle conversations: ", a.idle ? IDLE[a.idle].words : null, "idle"]);
  lines.push(["- Conversations I keep working in: ", a.working ? WORKING[a.working].words : null, "working"]);
  lines.push("");
  lines.push("Check what you can first (omp works, the Glitch folder holds .claude/hooks/write-guard.py, my GitHub names) and tell me anything that doesn't match before you run the installer. Then run it once with all of this, read its output back to me in plain words, and tell me what to do next.");
  return lines;
}

function promptText(lines) {
  return lines.map(l => typeof l === "string" ? l : l[0] + (l[1] ?? "…")).join("\n");
}

function installCommand(a) {
  const parts = ["uv run install.py"];
  if (!a.noGlitch && a.glitch.trim()) parts.push("--glitch " + shq(a.glitch.trim()));
  if (a.ghMode === "list") names(a.gh).forEach(n => parts.push("--github " + shq(n)));
  a.signins.forEach(k => parts.push("--sign-in " + k));
  if (a.idle) parts.push(IDLE[a.idle].set);
  if (a.working) parts.push(WORKING[a.working].set);
  return parts.join(" ");
}

function Choice({ name, value, current, onPick, title, note, rec }) {
  return html`<label class="choice">
    <input type="radio" name=${name} value=${value} checked=${current === value} onChange=${() => onPick(value)} />
    <div><b>${title}${rec ? html`<span class="rec">recommended</span>` : null}</b><span>${note}</span></div>
  </label>`;
}

function Slip({ answers, lastChanged }) {
  const lines = buildPrompt(answers);
  const [copied, setCopied] = useState(false);
  const missing = lines.filter(l => typeof l !== "string" && l[1] == null).length;
  async function copy() {
    const text = promptText(lines);
    try { await navigator.clipboard.writeText(text); setCopied(true); }
    catch {
      const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select();
      try { setCopied(document.execCommand("copy")); } catch { setCopied(false); }
      t.remove();
    }
    setTimeout(() => setCopied(false), 2500);
  }
  return html`<aside class="slip" aria-label="Your setup prompt">
    <header><h3>Your prompt for Claude</h3><span>${missing ? `${missing} to fill in` : "ready to copy"}</span></header>
    <pre>${lines.map((l, i) => typeof l === "string"
      ? html`${l}${i < lines.length - 1 ? "\n" : ""}`
      : html`${l[0]}${l[1] == null ? html`<span class="blank">…</span>` : html`<span class=${l[2] === lastChanged ? "fresh" : ""} key=${l[2] + l[1]}>${l[1]}</span>`}${"\n"}`)}</pre>
    <footer>
      <button class="small" onClick=${copy} disabled=${missing > 0}>Copy prompt</button>
      ${copied ? html`<span class="copied">Copied</span>` : html`<small>${missing ? "Answer the steps to finish it." : "Paste it into Claude Code in the pack folder."}</small>`}
    </footer>
  </aside>`;
}

function App() {
  const [step, setStep] = useState(0);
  const [seen, setSeen] = useState(0);
  const [a, setA] = useState({ signins: [], other: false, glitch: "", noGlitch: false, ghMode: "find", gh: "", idle: "200000", working: "325000" });
  const [lastChanged, setLastChanged] = useState(null);
  const top = useRef(null);
  const set = (key, slot) => value => { setA(prev => ({ ...prev, [key]: value })); setLastChanged(slot); };
  const go = n => { setStep(n); setSeen(s => Math.max(s, n)); top.current && top.current.scrollIntoView({ block: "start" }); };
  useEffect(() => { const h = top.current && top.current.querySelector("h2"); h && h.focus(); }, [step]);

  const toggleSignin = k => set("signins", "signin")(a.signins.includes(k) ? a.signins.filter(x => x !== k) : [...a.signins, k]);
  const moveSignin = (k, by) => {
    const list = [...a.signins]; const i = list.indexOf(k); const j = i + by;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    set("signins", "signin")(list);
  };
  const firstIdle = a.signins.length ? SIGNINS[a.signins[0]].idle : "other";
  const done = [true, a.signins.length > 0 || a.other, a.noGlitch || !!a.glitch.trim(), a.ghMode !== "list" || names(a.gh).length > 0, !!a.idle, !!a.working, false];
  const canNext = done[step];

  let body;
  if (step === 0) body = html`
    <h2 tabindex="-1">Set up omp to run Glitch</h2>
    <p class="lede">Five short questions, then you get one prompt to paste into Claude Code. Claude checks your answers and runs the starter pack's installer for you.</p>
    <p class="why">What the pack fixes, from three weeks of running Glitch under omp:</p>
    <ul class="fixes">
      <li>Glitch's own guards keep working<span>Its hooks for engine files, secrets and outside reads run in omp too.</span></li>
      <li>Auto mode blocks less, and you know when it isn't on<span>Fewer "response was not 0 or 1" blocks, and a warning if it fails to load after an update.</span></li>
      <li>Long sessions cost less<span>A conversation is shrunk once it gets big or sits idle, and Glitch saves it to memory first.</span></li>
      <li>Background helpers run on small models<span>Titles, commit messages and image reads stop spending your main model's usage.</span></li>
      <li>A limit on one sign-in doesn't stop you<span>Signed in to more than one? When one hits a rate or usage limit, omp carries on with the next.</span></li>
    </ul>
    <p class="why">You need these on your computer first:</p>
    <ul class="need">
      <li><b>omp</b><span>The coding agent this sets up. Install it from <a href="https://github.com/can1357/oh-my-pi#install">its install page</a>, open it, and sign in.</span></li>
      <li><b>uv</b><span>Runs the installer. Glitch's own setup already put it there.</span></li>
      <li><b>Claude Code</b><span>Runs the setup for you. omp works for this too.</span></li>
    </ul>`;
  if (step === 1) body = html`
    <h2 tabindex="-1">Which sign-ins do you use in omp?</h2>
    <p class="why">Tick each one you're signed in to, then put them in order. The first one's small models run omp's background helpers. When a model hits a rate or usage limit, omp moves to the next sign-in down the list, and back once the limit resets.</p>
    <ol class="order">
      ${[...a.signins, ...Object.keys(SIGNINS).filter(k => !a.signins.includes(k))].map(k => {
        const s = SIGNINS[k]; const pos = a.signins.indexOf(k);
        return html`<li key=${k}><label class="choice">
          <input type="checkbox" checked=${pos >= 0} onChange=${() => toggleSignin(k)} />
          <div><b>${pos >= 0 ? html`<span class="pos">${pos + 1}</span>` : null}${s.label}${pos === 0 ? html`<span class="rec">helpers</span>` : null}</b><span>${s.note}</span></div>
          ${pos >= 0 && a.signins.length > 1 ? html`<div class="moves">
            <button type="button" class="outline small" aria-label=${"Move " + s.label + " up"} disabled=${pos === 0} onClick=${e => { e.preventDefault(); moveSignin(k, -1); }}>↑</button>
            <button type="button" class="outline small" aria-label=${"Move " + s.label + " down"} disabled=${pos === a.signins.length - 1} onClick=${e => { e.preventDefault(); moveSignin(k, 1); }}>↓</button>
          </div>` : null}
        </label></li>`;
      })}
    </ol>
    <label class="check"><input type="checkbox" checked=${a.other} onChange=${e => set("other", "signin")(e.target.checked)} /> I also use something else (an API key or another provider)</label>
    <p class="why">Not signed in yet? Open omp, type <kbd>/login</kbd>, and check it answers a "hello" before you go on. Only tick sign-ins that work.</p>`;
  if (step === 2) body = html`
    <h2 tabindex="-1">Where is your Glitch folder?</h2>
    <p class="why">The folder you open Claude Code in to talk to Glitch. It holds <code>.claude/hooks/write-guard.py</code>; Claude checks that before installing.</p>
    <div class="field">
      <label for="glitch">Folder path</label>
      <input id="glitch" type="text" placeholder="~/glitch" value=${a.glitch} disabled=${a.noGlitch} onInput=${e => set("glitch", "glitch")(e.target.value)} />
      <small>On a Mac, drag the folder into a terminal window to see its path.</small>
    </div>
    <label class="check"><input type="checkbox" checked=${a.noGlitch} onChange=${e => set("noGlitch", "glitch")(e.target.checked)} /> I don't have Glitch set up yet</label>`;
  if (step === 3) body = html`
    <h2 tabindex="-1">Which GitHub accounts are yours?</h2>
    <p class="why">Auto mode treats a push to these as a push to your own space. A push anywhere else gets a closer look. Leave out anything you're unsure of; not Glitch's own repo.</p>
    <div class="choices">
      <${Choice} name="gh" value="find" current=${a.ghMode} onPick=${set("ghMode", "gh")} title="Have Claude find them" note="It looks at your GitHub sign-in and your projects, then reads the list back to you." rec />
      <${Choice} name="gh" value="list" current=${a.ghMode} onPick=${set("ghMode", "gh")} title="I'll type them" note="Your username, plus any organisations you push to." />
      <${Choice} name="gh" value="none" current=${a.ghMode} onPick=${set("ghMode", "gh")} title="I don't use GitHub" note="Every push gets a closer look." />
    </div>
    ${a.ghMode === "list" ? html`<div class="field">
      <label for="gh">GitHub names, separated by commas</label>
      <input id="gh" type="text" placeholder="your-username, your-org" value=${a.gh} onInput=${e => set("gh", "gh")(e.target.value)} />
    </div>` : null}`;
  if (step === 4) body = html`
    <h2 tabindex="-1">When should an idle conversation be shrunk?</h2>
    <p class="lede">omp resends the whole conversation on every turn, so a long one left open is costly to come back to. With this on, one over the limit that you leave alone is shrunk to a summary plus its latest messages. Glitch saves the chat to memory first.</p>
    <p class="why">${firstIdle === "never"
      ? "On a ChatGPT sign-in this never happens: its saved copy of the conversation doesn't expire. The next question is the one that counts for you."
      : firstIdle === "claude"
        ? "On a Claude sign-in it happens a little under an hour after your last message, just before Claude's saved copy of the conversation expires."
        : "It happens once the conversation has sat idle for a while, up to an hour."}</p>
    <div class="choices">
      ${Object.entries(IDLE).map(([v, o]) => html`<${Choice} name="idle" value=${v} current=${a.idle} onPick=${set("idle", "idle")} title=${o.label} note=${o.note.replace("Recommended.", "The middle ground.")} rec=${v === "200000"} />`)}
    </div>`;
  if (step === 5) body = html`
    <h2 tabindex="-1">How big can a conversation get while you work?</h2>
    <p class="lede">The idle limit only helps a conversation you leave. One you keep working in grows until omp shrinks it, and by default that is close to the model's limit, with every turn resending all of it.</p>
    <p class="why">On a model whose own limit is smaller than this, omp uses its default instead.</p>
    <div class="choices">
      ${Object.entries(WORKING).map(([v, o]) => html`<${Choice} name="working" value=${v} current=${a.working} onPick=${set("working", "working")} title=${o.label} note=${o.note.replace("Recommended.", "Big enough for long tasks, well short of a million.")} rec=${v === "325000"} />`)}
    </div>`;
  if (step === 6) {
    const missing = done.slice(1, 6).map((d, i) => d ? null : i + 1).filter(n => n != null);
    body = html`<div class="finish">
      <h2 tabindex="-1">${missing.length ? "Almost there" : "Hand it to Claude"}</h2>
      ${missing.length ? html`<p class="lede">Step ${missing.join(" and ")} still needs an answer. Pick it from the list on the left.</p>` : html`
      <ol>
        <li><p><b>Get the pack.</b> If you opened this page from the pack's folder, you already have it.</p>
          <pre class="cmd">git clone ${REPO}</pre></li>
        <li><p><b>Open Claude Code in the pack's folder</b>, not your Glitch folder.</p>
          <pre class="cmd">cd omp-starter-pack${"\n"}claude</pre></li>
        <li><p><b>Paste the prompt</b> from the right and answer anything it asks. When it's done, restart omp.</p></li>
      </ol>
      <details><summary>Rather run it yourself?</summary>
        <p class="why">This is the command Claude should end up running, from the pack's folder. Claude also checks your answers first; on your own, check the Glitch folder path is right.</p>
        <pre class="cmd">${installCommand(a)}</pre>
      </details>`}
    </div>`;
  }

  return html`<div class="shell" ref=${top}>
    <header class="masthead">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 40V14l8 8h16l8-8v26z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M17 30h3M28 30h3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M4 33h7M37 33h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"/></svg>
      <div><h1>omp starter pack for Glitch</h1><p>Answer a few questions; Claude does the setup.</p></div>
    </header>
    <ol class="rail">
      ${STEPS.map((s, i) => html`<li class=${(i === step ? "here " : "") + (i > 0 && i < 6 && i <= seen && done[i] && i !== step ? "done" : "")}>
        <button onClick=${() => go(i)} aria-current=${i === step ? "step" : null}><span class="n">${i + 1}</span>${s}</button></li>`)}
    </ol>
    <section class="step">
      ${body}
      <div class="nav">
        ${step > 0 ? html`<button class="outline" onClick=${() => go(step - 1)}>Back</button>` : null}
        ${step < 6 ? html`<button onClick=${() => go(step + 1)} disabled=${!canNext}>${step === 0 ? "Start" : "Next"}</button>` : null}
      </div>
    </section>
    <${Slip} answers=${a} lastChanged=${lastChanged} />
  </div>`;
}

render(html`<${App} />`, document.getElementById("app"));
</script>
</body>
</html>
